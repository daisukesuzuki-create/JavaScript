<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>JavaScript練習問題3</title>
</head>
<body>
  <form id="myForm">
    <div>
      <label>名前: <input type="text" id="nameInput"></label>
      <p class="error" id="nameError" style="color: red;"></p>
    </div>
    <div>
      <label>年齢: <input type="text" id="ageInput"></label>
      <p class="error" id="ageError" style="color: red;"></p>
    </div>
    <div>
      <label>メール: <input type="text" id="emailInput"></label>
      <p class="error" id="emailError" style="color: red;"></p>
    </div>
    <div>
      <label>電話番号: <input type="text" id="phoneInput" placeholder="ハイフンなし"></label>
      <p class="error" id="phoneError" style="color: red;"></p>
    </div>
    <button type="button" id="submitBtn">送信</button>
  </form>
  <script src="script3.js"></script>
</body>
</html>
